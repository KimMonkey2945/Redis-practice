spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

#  cache:
#     type: redis
#     redis:
#      time-to-live: 1h

  datasource:
    url: jdbc:postgresql://localhost:5432/redis_study
    username: postgres
    password: 1234

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /docs